<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Legacy Planning · Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="legacy/styles.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0e1118; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="legacy/logos.jsx"></script>
  <script type="text/babel" src="legacy/logins.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "logoVariant": "convene",
      "palette": "navy",
      "stackedWordmark": true,
      "headline": "legacy"
    }/*EDITMODE-END*/;

    // Map our palette names to swatch palettes so TweakColor shows real colors.
    const PALETTE_SWATCH = {
      navy:   ["#4a78ff", "#0b1838", "#fafbfd"],
      plum:   ["#a07cff", "#1a132e", "#f6f1e7"],
      forest: ["#2dbfa3", "#0f1f1c", "#fafbfd"],
      ember:  ["#ff7a3c", "#1c1410", "#f6f1e7"],
    };
    const SWATCH_OPTIONS = Object.values(PALETTE_SWATCH);
    const SWATCH_NAMES   = Object.keys(PALETTE_SWATCH);

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // TweakColor stores the array; convert back to a palette name for our CSS.
      const swatchValue = PALETTE_SWATCH[t.palette] || PALETTE_SWATCH.navy;
      const onSwatch = (arr) => {
        const name = SWATCH_NAMES[SWATCH_OPTIONS.findIndex(s => s === arr)] || "navy";
        setTweak("palette", name);
      };

      return (
        <>
          <DesignCanvas
            title="Legacy Planning · Login & Logo"
            subtitle="3 conceitos de logo + 3 variações de tela de login. Use os Tweaks (canto inferior direito) para trocar o logo e a paleta de marca em tempo real."
          >
            <DCSection
              id="login-home"
              title="Login · Casado com a Home"
              subtitle="Versão refeita pra falar a mesma língua visual da sua home: canvas creme, accent royal blue, display Inter Extrabold com segunda linha em azul, mono labels (`# entrar`, `economizadas /mês`), e o form num card dark navy idêntico aos cards da home."
            >
              <DCArtboard id="login-d" label="Login · Cream + Dark Card (home-matched)" width={1440} height={900}>
                <LoginD logoVariant={t.logoVariant} palette={t.palette} />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="logos"
              title="Conceitos de logo"
              subtitle="Mantém o triângulo como ícone, três interpretações. Cada conceito aparece em fundo claro e escuro, com escalas reduzidas para favicon e nav."
            >
              <DCArtboard id="logo-gallery" label="3 conceitos · claro + escuro · escalas" width={1440} height={720}>
                <LogoGallery palette={t.palette} />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="logins"
              title="Aurora Glass — exploração anterior"
              subtitle="Direção descartada porque destoa do visual da home. Mantida só como referência."
            >
              <DCArtboard id="login-c-dark" label="C · Aurora Glass — Dark" width={1440} height={900}>
                <LoginC logoVariant={t.logoVariant} palette={t.palette} theme="dark" />
              </DCArtboard>
              <DCArtboard id="login-c-light" label="C · Aurora Glass — Light" width={1440} height={900}>
                <LoginC logoVariant={t.logoVariant} palette={t.palette} theme="light" />
              </DCArtboard>
            </DCSection>

            <DCSection
              id="explorations"
              title="Outras explorações"
              subtitle="Variações A e B do começo da conversa."
            >
              <DCArtboard id="login-a" label="A · Refined Navy" width={1440} height={900}>
                <LoginA logoVariant={t.logoVariant} palette={t.palette} />
              </DCArtboard>
              <DCArtboard id="login-b" label="B · Editorial Cream" width={1440} height={900}>
                <LoginB logoVariant={t.logoVariant} palette={t.palette} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Logo" />
            <TweakRadio
              label="Conceito"
              value={t.logoVariant}
              options={["peaks", "apex", "convene"]}
              onChange={(v) => setTweak("logoVariant", v)}
            />

            <TweakSection label="Marca" />
            <TweakColor
              label="Paleta"
              value={swatchValue}
              options={SWATCH_OPTIONS}
              onChange={onSwatch}
            />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
